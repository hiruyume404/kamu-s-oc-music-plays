<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水晶玻璃風 OC 迷你播放器 (透明與明暗適應版)</title>
    <!-- 使用 Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 定義系統明暗自適應的 CSS 變數 */
        :root {
            /* 預設深色模式 (Dark Mode) */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.22);
            --button-bg: rgba(255, 255, 255, 0.08);
            --button-hover: rgba(255, 255, 255, 0.16);
            --progress-bg: rgba(255, 255, 255, 0.1);
            --glass-shine: rgba(255, 255, 255, 0.25);
            --cog-color: rgba(255, 255, 255, 0.2);
            --cog-hover: rgba(255, 255, 255, 0.75);
        }

        @media (prefers-color-scheme: light) {
            :root {
                /* 自動轉換為淺色模式 (Light Mode) */
                --text-primary: #0f172a; /* Slate 900 */
                --text-secondary: rgba(15, 23, 42, 0.6);
                --card-bg: rgba(15, 23, 42, 0.06);
                --card-border: rgba(15, 23, 42, 0.16);
                --button-bg: rgba(15, 23, 42, 0.06);
                --button-hover: rgba(15, 23, 42, 0.12);
                --progress-bg: rgba(15, 23, 42, 0.08);
                --glass-shine: rgba(15, 23, 42, 0.15);
                --cog-color: rgba(15, 23, 42, 0.3);
                --cog-hover: rgba(15, 23, 42, 0.8);
            }
        }

        @keyframes rotate-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-vinyl {
            animation: rotate-vinyl 14s linear infinite;
        }
        .pause-vinyl {
            animation-play-state: paused;
        }
        
        /* 水晶鏡面高光斜線 (隨明暗模式變化折射高光色) */
        .glass-highlight::after {
            content: '';
            position: absolute;
            top: -150%;
            left: -150%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0) 40%,
                var(--glass-shine) 48%,
                rgba(255, 255, 255, 0.35) 50%,
                var(--glass-shine) 52%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(0deg);
            pointer-events: none;
            transition: all 0.6s ease;
        }
        .glass-highlight:hover::after {
            transform: translate(10%, 10%);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="text-slate-100 flex items-center justify-center min-h-screen p-4 select-none transition-colors duration-500 overflow-hidden bg-slate-950">

    <!-- 編輯狀態時的動態背景漸層光暈 (嵌入模式下會自動隱藏，確保絕對透明) -->
    <div id="auraContainer" class="absolute inset-0 overflow-hidden pointer-events-none">
        <div id="auraBg1" class="absolute -right-20 -bottom-20 w-96 h-96 rounded-full blur-[110px] opacity-35 transition-all duration-1000" style="background-color: var(--accent-color, #38bdf8);"></div>
        <div id="auraBg2" class="absolute -left-20 -top-20 w-96 h-96 rounded-full blur-[110px] opacity-30 transition-all duration-1000" style="background-color: var(--vinyl-color, #fda4af);"></div>
    </div>

    <!-- 播放器主卡片 (極致通透水晶玻璃 - 邊框/底色隨系統明暗自動調整) -->
    <div id="playerContainer" class="glass-highlight w-full max-w-[360px] rounded-[24px] p-4.5 backdrop-blur-3xl shadow-[0_20px_50px_rgba(0,0,0,0.35)] flex items-center gap-4 transition-all duration-300 relative z-10 overflow-hidden"
         style="background-color: var(--card-bg); border: 1.5px solid var(--card-border);">
        
        <!-- 彩色黑膠唱片盤面 -->
        <div class="relative flex-shrink-0 cursor-pointer group/vinyl" id="vinylWrapper">
            <!-- 唱片主體 (外圈彩色黑膠溝槽) -->
            <div id="vinylDisc" class="w-18 h-18 rounded-full shadow-[0_8px_20px_rgba(0,0,0,0.4)] relative flex items-center justify-center transition-all duration-500 animate-vinyl pause-vinyl" 
                 style="background: radial-gradient(circle, rgba(0,0,0,0.85) 30%, var(--vinyl-color, #fda4af) 70%, rgba(0,0,0,0.95) 100%);">
                
                <!-- 唱片微細溝槽紋路 (SVG 疊加) -->
                <div class="absolute inset-0 rounded-full opacity-35" style="background: repeating-radial-gradient(circle, transparent, transparent 2px, rgba(255,255,255,0.1) 3px, rgba(0,0,0,0.2) 4px);"></div>

                <!-- 唱片中心專輯封面 (本地上傳圖片顯示處) -->
                <div class="w-10 h-10 rounded-full overflow-hidden relative z-10 border border-black/30 shadow-inner">
                    <img id="trackCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150" 
                         class="w-full h-full object-cover" alt="Cover">
                </div>

                <!-- 黑膠唱片中心軸孔 -->
                <div class="absolute inset-0 m-auto w-3 h-3 bg-slate-950 rounded-full border border-white/25 z-20 flex items-center justify-center shadow-inner">
                    <div class="w-0.75 h-0.75 bg-white/90 rounded-full"></div>
                </div>
            </div>
            
            <!-- 播放時的波紋呼吸環 -->
            <div id="pulseRing" class="absolute -inset-1.5 rounded-full border-2 border-transparent pointer-events-none transition-all duration-700 scale-100 opacity-0"></div>
        </div>

        <!-- 播放器控制與文字區 (樣式與顏色隨系統明暗自動調整) -->
        <div class="flex-1 min-w-0 flex flex-col justify-between h-[72px]">
            <div class="truncate pr-4">
                <h3 id="trackTitle" class="text-sm font-semibold truncate tracking-wide filter drop-shadow-sm transition-colors duration-300" style="color: var(--text-primary);">OC 印象曲名稱</h3>
                <p id="trackArtist" class="text-xs truncate mt-0.5 tracking-wider transition-colors duration-300" style="color: var(--text-secondary);">角色名 / 歌手</p>
            </div>
            
            <div class="flex items-center justify-between gap-3 mt-1.5">
                <!-- 播放暫停鈕 (顏色跟隨點綴色，襯底與邊框隨系統明暗自適應) -->
                <button id="playBtn" class="w-8 h-8 rounded-full flex items-center justify-center transition active:scale-90 cursor-pointer shadow-sm hover:shadow-md transition-all duration-300" 
                        style="color: var(--accent-color, #38bdf8); background-color: var(--button-bg); border: 1px solid var(--card-border);">
                    <i class="fas fa-play text-xs translate-x-[1px]" id="playIcon"></i>
                </button>
                
                <!-- 進度條容器 -->
                <div class="flex-1 py-2.5 cursor-pointer" id="progressContainer">
                    <div class="h-1 rounded-full overflow-hidden relative shadow-inner" style="background-color: var(--progress-bg);">
                        <div id="progressBar" class="h-full rounded-full transition-all duration-100" style="width: 0%; background-color: var(--accent-color, #38bdf8);"></div>
                    </div>
                </div>
                
                <!-- 時間顯示 -->
                <span id="timeDisplay" class="text-[10px] font-mono tracking-tighter w-8 text-right transition-colors duration-300" style="color: var(--text-secondary);">00:00</span>
            </div>
        </div>

        <!-- HTML5 音頻主件 -->
        <audio id="audioSource" src=""></audio>

        <!-- 水晶隱形設定鈕 (預設隨系統明暗變更，Hover 時浮現) -->
        <button id="toggleEditBtn" class="absolute top-2.5 right-2.5 text-[10px] transition-all duration-300 w-6 h-6 rounded-full bg-white/0 hover:bg-white/10 border border-transparent flex items-center justify-center cursor-pointer z-30"
                style="color: var(--cog-color);">
            <i class="fas fa-cog"></i>
        </button>
    </div>

    <!-- 隱藏的圖片壓縮 Canvas 引擎 -->
    <canvas id="compressCanvas" class="hidden"></canvas>

    <!-- 編輯設定面板 (此面板始終保持精緻黑底毛玻璃，確保編輯時辨識度最高) -->
    <div id="editPanel" class="fixed inset-y-4 right-4 w-80 bg-slate-950/90 backdrop-blur-2xl border border-white/10 rounded-2xl p-5 shadow-[0_25px_60px_rgba(0,0,0,0.6)] z-50 transform translate-x-[340px] opacity-0 transition-all duration-500 ease-out hidden flex-col">
        <div class="flex justify-between items-center pb-3 border-b border-white/10">
            <h3 class="font-bold tracking-wider flex items-center gap-1.5" style="color: var(--accent-color, #38bdf8);">
                <i class="fas fa-magic"></i> GitHub 部署特化面板
            </h3>
            <button id="closePanelBtn" class="text-slate-400 hover:text-white transition w-6 h-6 rounded-full hover:bg-white/10 flex items-center justify-center cursor-pointer">
                <i class="fas fa-times text-xs"></i>
            </button>
        </div>
        
        <!-- 設定滾動表單 -->
        <div class="flex-1 overflow-y-auto py-3 space-y-4 pr-1">
            
            <!-- 彩色唱片與主題配色 -->
            <div>
                <label class="block text-xs text-slate-400 mb-1.5 font-medium">特鹽風快速預設配調</label>
                <div class="grid grid-cols-5 gap-2">
                    <button class="theme-preset-btn h-8 rounded-lg border border-white/10 flex items-center justify-center text-[11px] cursor-pointer" data-accent="#f472b6" data-vinyl="#fda4af">🌸</button>
                    <button class="theme-preset-btn h-8 rounded-lg border border-white/10 flex items-center justify-center text-[11px] cursor-pointer" data-accent="#c084fc" data-vinyl="#a78bfa">🔮</button>
                    <button class="theme-preset-btn h-8 rounded-lg border border-white/10 flex items-center justify-center text-[11px] cursor-pointer" data-accent="#34d399" data-vinyl="#10b981">🍵</button>
                    <button class="theme-preset-btn h-8 rounded-lg border border-white/10 flex items-center justify-center text-[11px] cursor-pointer" data-accent="#38bdf8" data-vinyl="#3b82f6">🐳</button>
                    <button class="theme-preset-btn h-8 rounded-lg border border-white/10 flex items-center justify-center text-[11px] cursor-pointer" data-accent="#94a3b8" data-vinyl="#475569">🌙</button>
                </div>
            </div>

            <!-- 自訂色彩細調 -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">主色調 (按鈕/進度條)</label>
                    <div class="flex items-center gap-1.5 bg-slate-900 border border-white/10 rounded-lg p-1.5">
                        <input type="color" id="inputColor" class="w-6 h-6 border-0 bg-transparent rounded-md cursor-pointer" value="#38bdf8">
                        <span class="text-[10px] font-mono uppercase text-slate-300" id="colorHex">#38BDF8</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">唱片盤面顏色</label>
                    <div class="flex items-center gap-1.5 bg-slate-900 border border-white/10 rounded-lg p-1.5">
                        <input type="color" id="inputVinylColor" class="w-6 h-6 border-0 bg-transparent rounded-md cursor-pointer" value="#fda4af">
                        <span class="text-[10px] font-mono uppercase text-slate-300" id="vinylColorHex">#FDA4AF</span>
                    </div>
                </div>
            </div>

            <!-- 本地上傳專輯封面 -->
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-medium">專輯封面上傳 (自動無損裁剪)</label>
                <div class="flex items-center gap-3">
                    <label class="flex-1 flex flex-col items-center justify-center border border-dashed border-white/20 hover:border-white/40 bg-slate-900 hover:bg-slate-900/60 transition p-2.5 rounded-xl cursor-pointer text-center group">
                        <i class="fas fa-cloud-upload-alt text-sm mb-1 group-hover:scale-110 transition" style="color: var(--accent-color, #38bdf8);"></i>
                        <span class="text-[10px] text-slate-300" id="uploadStatus">選擇本地圖片</span>
                        <input type="file" id="inputCoverFile" accept="image/*" class="hidden">
                    </label>
                    <div class="w-11 h-11 rounded-lg overflow-hidden border border-white/10 bg-black flex-shrink-0">
                        <img id="previewThumb" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <!-- 音效上傳與 GitHub 直連設定區 -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs text-slate-400 font-medium">音訊來源設定</label>
                    <div class="flex bg-slate-900 rounded-md p-0.5 border border-white/5 text-[10px]">
                        <button type="button" id="tabGithubBtn" class="px-2 py-0.5 rounded text-white bg-white/10 font-medium cursor-pointer">同倉庫直連</button>
                        <button type="button" id="tabUploadBtn" class="px-2 py-0.5 rounded text-slate-400 hover:text-white cursor-pointer">本機預聽</button>
                    </div>
                </div>

                <!-- GitHub 同目錄偵測 (最推薦) -->
                <div id="audioGithubContainer" class="space-y-2">
                    <div class="bg-slate-900/60 border border-white/10 rounded-xl p-3 space-y-2">
                        <div class="flex items-center gap-2">
                            <input type="text" id="inputAudioFilename" class="flex-1 bg-slate-950 border border-white/10 rounded-lg px-2 py-1 text-white text-xs focus:outline-none" value="music.mp3" placeholder="請輸入音檔名稱 (含副檔名)">
                            <button type="button" id="detectAudioBtn" class="bg-sky-500 hover:bg-sky-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg transition shrink-0 cursor-pointer">
                                自動偵測
                            </button>
                        </div>
                        <p class="text-[9px] text-slate-400 leading-normal">
                            💡 將 MP3 重新命名為簡單的英文 (例如 <code class="text-sky-300">music.mp3</code>) 上傳到跟此網頁相同的 GitHub 資料夾，點選偵測即可一秒取得直鏈！
                        </p>
                    </div>
                    <!-- 顯示目前偵測到的網址狀態 -->
                    <div id="detectedUrlDisplay" class="bg-slate-950 rounded-lg p-2 border border-white/5 hidden">
                        <span class="block text-[8px] text-slate-500 uppercase tracking-wider">目前配對成功的直鏈網址：</span>
                        <p id="detectedUrlText" class="text-[10px] text-sky-400 truncate mt-0.5 select-all"></p>
                    </div>
                </div>

                <!-- 本地上傳分頁 (僅本機快播試聽) -->
                <div id="audioUploadContainer" class="space-y-1 hidden">
                    <label class="flex flex-col items-center justify-center border border-dashed border-white/20 hover:border-white/40 bg-slate-900 hover:bg-slate-900/60 transition p-3 rounded-xl cursor-pointer text-center group">
                        <i class="fas fa-file-audio text-lg mb-1 group-hover:scale-110 transition" style="color: var(--accent-color, #38bdf8);"></i>
                        <span class="text-[10px] text-slate-300 font-medium" id="audioUploadStatus">上傳本地音訊檔進行測試</span>
                        <input type="file" id="inputAudioFile" accept="audio/*" class="hidden">
                    </label>
                    <p id="audioNameDisplay" class="text-[10px] text-sky-400/80 truncate px-1 hidden"></p>
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1 font-medium">歌曲名稱</label>
                <input type="text" id="inputTitle" class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-1.5 text-white text-xs focus:border-sky-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-medium">演出者 / OC 角色名</label>
                <input type="text" id="inputArtist" class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-1.5 text-white text-xs focus:border-sky-500 focus:outline-none transition">
            </div>
        </div>

        <!-- 複製動作區 -->
        <div class="pt-3 border-t border-white/10">
            <button id="copyBtn" class="w-full text-white font-bold py-2.5 rounded-xl text-xs transition active:scale-95 cursor-pointer flex items-center justify-center gap-1.5 shadow-[0_4px_15px_rgba(0,0,0,0.3)] hover:brightness-110" style="background: linear-gradient(135deg, var(--accent-color, #38bdf8), var(--vinyl-color, #fda4af));">
                <i class="fas fa-copy"></i> 生成並複製 Notion 嵌入連結
            </button>
        </div>
    </div>

    <!-- 自訂極簡 Toast 提示框 -->
    <div id="toast" class="fixed bottom-6 px-4 py-2.5 bg-slate-900/95 backdrop-blur-md border border-white/10 text-white text-xs rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] transition-all duration-300 transform translate-y-10 opacity-0 z-50 flex items-center gap-2">
        <i id="toastIcon" class="fas text-sky-400"></i>
        <span id="toastMsg"></span>
    </div>

    <script>
        // 初始化自訂色彩與全域變數
        let accentColor = '#38bdf8';
        let vinylColor = '#fda4af';
        let compressedCoverBase64 = ''; // 儲存智慧壓縮後的封面圖像 Base64
        let currentAudioMode = 'github'; // 'github' 或 'upload'
        let githubAudioUrl = '';        // 自動生成的 GitHub 同儲存庫音訊網址

        // 取得 DOM 節點
        const audio = document.getElementById('audioSource');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const trackCover = document.getElementById('trackCover');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const vinylWrapper = document.getElementById('vinylWrapper');
        const vinylDisc = document.getElementById('vinylDisc');
        const pulseRing = document.getElementById('pulseRing');

        const toggleEditBtn = document.getElementById('toggleEditBtn');
        const editPanel = document.getElementById('editPanel');
        const closePanelBtn = document.getElementById('closePanelBtn');
        const copyBtn = document.getElementById('copyBtn');

        // 輸入控制節點
        const inputTitle = document.getElementById('inputTitle');
        const inputArtist = document.getElementById('inputArtist');
        const inputCoverFile = document.getElementById('inputCoverFile');
        const uploadStatus = document.getElementById('uploadStatus');
        const previewThumb = document.getElementById('previewThumb');
        
        const inputColor = document.getElementById('inputColor');
        const inputVinylColor = document.getElementById('inputVinylColor');
        const colorHex = document.getElementById('colorHex');
        const vinylColorHex = document.getElementById('vinylColorHex');

        // 音訊與 GitHub 特化節點
        const tabGithubBtn = document.getElementById('tabGithubBtn');
        const tabUploadBtn = document.getElementById('tabUploadBtn');
        const audioGithubContainer = document.getElementById('audioGithubContainer');
        const audioUploadContainer = document.getElementById('audioUploadContainer');
        
        const inputAudioFilename = document.getElementById('inputAudioFilename');
        const detectAudioBtn = document.getElementById('detectAudioBtn');
        const detectedUrlDisplay = document.getElementById('detectedUrlDisplay');
        const detectedUrlText = document.getElementById('detectedUrlText');

        const inputAudioFile = document.getElementById('inputAudioFile');
        const audioUploadStatus = document.getElementById('audioUploadStatus');
        const audioNameDisplay = document.getElementById('audioNameDisplay');

        // Toast 訊息框
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.textContent = message;
            if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle text-rose-400';
            } else {
                toastIcon.className = 'fas fa-check-circle text-emerald-400';
            }

            toast.classList.remove('translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 3000);
        }

        // 切換音訊模式分頁
        function setAudioMode(mode) {
            currentAudioMode = mode;
            if (mode === 'github') {
                tabGithubBtn.classList.add('bg-white/10', 'text-white');
                tabGithubBtn.classList.remove('text-slate-400');
                tabUploadBtn.classList.remove('bg-white/10', 'text-white');
                tabUploadBtn.classList.add('text-slate-400');
                audioGithubContainer.classList.remove('hidden');
                audioUploadContainer.classList.add('hidden');
            } else {
                tabUploadBtn.classList.add('bg-white/10', 'text-white');
                tabUploadBtn.classList.remove('text-slate-400');
                tabGithubBtn.classList.remove('bg-white/10', 'text-white');
                tabGithubBtn.classList.add('text-slate-400');
                audioUploadContainer.classList.remove('hidden');
                audioGithubContainer.classList.add('hidden');
            }
        }

        tabGithubBtn.addEventListener('click', () => setAudioMode('github'));
        tabUploadBtn.addEventListener('click', () => setAudioMode('upload'));

        // 自動偵測同倉庫音樂直鏈 (GitHub 特化技術)
        detectAudioBtn.addEventListener('click', () => {
            const filename = inputAudioFilename.value.trim();
            if (!filename) {
                showToast("請先輸入音樂檔案名稱！", "error");
                return;
            }

            // 抓取當前頁面部署後的 URL 路徑並組合
            const currentUrl = window.location.href.split('?')[0].split('#')[0];
            const lastSlashIndex = currentUrl.lastIndexOf('/');
            const resolvedUrl = currentUrl.substring(0, lastSlashIndex + 1) + filename;

            // 更新預覽並顯示
            githubAudioUrl = resolvedUrl;
            detectedUrlText.textContent = resolvedUrl;
            detectedUrlDisplay.classList.remove('hidden');

            // 立即測試載入音軌
            audio.src = resolvedUrl;
            audio.load();

            showToast("成功定位同倉庫音檔直鏈！");
        });

        // 動態更新色彩
        function updateColors(accent, vinyl) {
            accentColor = accent;
            vinylColor = vinyl;

            document.documentElement.style.setProperty('--accent-color', accent);
            document.documentElement.style.setProperty('--accent-color-alt', vinyl);
            document.documentElement.style.setProperty('--vinyl-color', vinyl);

            const auraBg1 = document.getElementById('auraBg1');
            const auraBg2 = document.getElementById('auraBg2');
            if (auraBg1 && auraBg2) {
                auraBg1.style.backgroundColor = accent;
                auraBg2.style.backgroundColor = vinyl;
            }

            // 黑膠背景動態重繪
            vinylDisc.style.background = `radial-gradient(circle, rgba(0,0,0,0.85) 30%, ${vinyl} 70%, rgba(0,0,0,0.95) 100%)`;

            // 同步設定欄位的值
            inputColor.value = accent;
            inputVinylColor.value = vinyl;
            colorHex.textContent = accent.toUpperCase();
            vinylColorHex.textContent = vinyl.toUpperCase();
        }

        // 監聽顏色選擇器
        inputColor.addEventListener('input', (e) => updateColors(e.target.value, vinylColor));
        inputVinylColor.addEventListener('input', (e) => updateColors(accentColor, e.target.value));

        // 預設特鹽風按鈕設定
        document.querySelectorAll('.theme-preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const accent = btn.getAttribute('data-accent');
                const vinyl = btn.getAttribute('data-vinyl');
                updateColors(accent, vinyl);
            });
        });

        // 智慧圖片上傳、裁切與壓縮 (120x120px)
        inputCoverFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadStatus.textContent = '讀取中...';
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('compressCanvas');
                    const ctx = canvas.getContext('2d');
                    const size = 120; 

                    canvas.width = size;
                    canvas.height = size;

                    let sx = 0, sy = 0, sWidth = img.width, sHeight = img.height;
                    if (img.width > img.height) {
                        sWidth = img.height;
                        sx = (img.width - img.height) / 2;
                    } else {
                        sHeight = img.width;
                        sy = (img.height - img.width) / 2;
                    }

                    ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, size, size);
                    compressedCoverBase64 = canvas.toDataURL('image/jpeg', 0.65);
                    
                    trackCover.src = compressedCoverBase64;
                    previewThumb.src = compressedCoverBase64;
                    uploadStatus.textContent = '上傳成功！';
                    showToast('封面圖片處理完成！');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 本機音訊快播測試機制
        inputAudioFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const objectURL = URL.createObjectURL(file);
            audio.src = objectURL;
            audioNameDisplay.textContent = `🎵 快聽：${file.name}`;
            audioNameDisplay.classList.remove('hidden');
            audioUploadStatus.textContent = '本機音檔載入成功';
            showToast("本地暫存測試音檔已就緒，可以開始播放！");
        });

        // 播放與暫停切換
        playBtn.addEventListener('click', togglePlay);
        vinylWrapper.addEventListener('click', togglePlay);

        function togglePlay() {
            if (!audio.src || audio.src === window.location.href || audio.src.endsWith('/')) {
                showToast('請先進行同目錄音檔自動偵測，或載入本地音檔！', 'error');
                openSettings();
                return;
            }
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        playIcon.className = 'fas fa-pause text-xs';
                        vinylDisc.classList.remove('pause-vinyl');
                        pulseRing.classList.remove('opacity-0', 'scale-100');
                        pulseRing.classList.add('opacity-100', 'scale-110');
                        pulseRing.style.borderColor = accentColor;
                    })
                    .catch(err => {
                        console.error(err);
                        showToast("播放失敗！請確認檔案已部署至 GitHub，且格式無損。", "error");
                    });
            } else {
                audio.pause();
                playIcon.className = 'fas fa-play text-xs translate-x-[1px]';
                vinylDisc.classList.add('pause-vinyl');
                pulseRing.classList.remove('opacity-100', 'scale-110');
                pulseRing.classList.add('opacity-0', 'scale-100');
            }
        }

        // 更新進度條
        audio.addEventListener('timeupdate', () => {
            const { duration, currentTime } = audio;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
                
                const curMin = String(Math.floor(currentTime / 60)).padStart(2, '0');
                const curSec = String(Math.floor(currentTime % 60)).padStart(2, '0');
                timeDisplay.textContent = `${curMin}:${curSec}`;
            }
        });

        // 點擊/觸控進度條跳轉
        function setProgress(e) {
            const width = progressContainer.clientWidth;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = Math.max(0, Math.min(clientX - rect.left, width));
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        }

        progressContainer.addEventListener('mousedown', (e) => {
            setProgress(e);
            function onMouseMove(moveEvent) { setProgress(moveEvent); }
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', () => {
                window.removeEventListener('mousemove', onMouseMove);
            }, { once: true });
        });

        progressContainer.addEventListener('touchstart', (e) => {
            setProgress(e);
            function onTouchMove(moveEvent) { setProgress(moveEvent); }
            window.addEventListener('touchmove', onTouchMove);
            window.addEventListener('touchend', () => {
                window.removeEventListener('touchmove', onTouchMove);
            }, { once: true });
        });

        // 播放終了重置
        audio.addEventListener('ended', () => {
            playIcon.className = 'fas fa-play text-xs translate-x-[1px]';
            vinylDisc.classList.add('pause-vinyl');
            pulseRing.classList.remove('opacity-100', 'scale-110');
            pulseRing.classList.add('opacity-0', 'scale-100');
            progressBar.style.width = '0%';
            timeDisplay.textContent = '00:00';
        });

        // 控制面板開啟與關閉
        toggleEditBtn.addEventListener('click', () => {
            if (editPanel.classList.contains('hidden')) {
                openSettings();
            } else {
                closeSettings();
            }
        });
        closePanelBtn.addEventListener('click', closeSettings);

        function openSettings() {
            editPanel.classList.remove('hidden');
            setTimeout(() => {
                editPanel.classList.remove('translate-x-[340px]', 'opacity-0');
            }, 10);
        }

        function closeSettings() {
            editPanel.classList.add('translate-x-[340px]', 'opacity-0');
            setTimeout(() => {
                editPanel.classList.add('hidden');
            }, 500);
        }

        // 解析 URL 參數並還原 OC 資料 (體貼處理 Notion 透明背景去背)
        function loadUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const embedMode = params.get('embed') === 'true';
            
            if (embedMode) {
                // 100% 透明去背模式啟動！
                toggleEditBtn.classList.add('hidden');
                document.body.classList.remove('bg-slate-950');
                document.body.classList.add('bg-transparent');
                
                // 隱藏背景發光，確保播放器與 Notion 底層元件無縫融合
                const auraContainer = document.getElementById('auraContainer');
                if (auraContainer) auraContainer.style.display = 'none';
            } else {
                // 獨立網頁編輯預覽時，保留高對比底色與炫酷背景霓虹光暈
                document.body.classList.add('bg-slate-950');
                document.body.classList.remove('bg-transparent');
                const auraContainer = document.getElementById('auraContainer');
                if (auraContainer) auraContainer.style.display = 'block';
            }

            if (window.location.hash) {
                try {
                    const rawData = atob(window.location.hash.substring(1));
                    const data = JSON.parse(decodeURIComponent(rawData));
                    
                    if (data.title) { trackTitle.textContent = data.title; inputTitle.value = data.title; }
                    if (data.artist) { trackArtist.textContent = data.artist; inputArtist.value = data.artist; }
                    
                    // 恢復主題色彩與唱片色
                    if (data.color && data.vinylColor) {
                        updateColors(data.color, data.vinylColor);
                    } else if (data.color) {
                        updateColors(data.color, data.color);
                    }

                    // 恢復專輯封面
                    if (data.cover) {
                        trackCover.src = data.cover;
                        previewThumb.src = data.cover;
                        compressedCoverBase64 = data.cover;
                    }

                    // 智慧音軌加載
                    if (data.audio) {
                        audio.src = data.audio;
                        githubAudioUrl = data.audio;
                        
                        try {
                            const parsedUrl = new URL(data.audio);
                            const pathParts = parsedUrl.pathname.split('/');
                            inputAudioFilename.value = pathParts[pathParts.length - 1];
                        } catch (err) {}

                        detectedUrlText.textContent = data.audio;
                        detectedUrlDisplay.classList.remove('hidden');
                        setAudioMode('github');
                    }
                } catch (e) {
                    console.error("還原資料失敗", e);
                }
            }
        }

        // 打包設定資料並複製新連結
        copyBtn.addEventListener('click', () => {
            if (currentAudioMode === 'github' && !githubAudioUrl) {
                showToast("請點擊『自動偵測』按鈕定位您的 GitHub 音檔！", "error");
                return;
            }

            const config = {
                title: inputTitle.value.trim() || '未命名歌曲',
                artist: inputArtist.value.trim() || '未知歌手',
                color: accentColor,
                vinylColor: vinylColor,
                cover: compressedCoverBase64 || trackCover.src,
                audio: currentAudioMode === 'github' ? githubAudioUrl : ''
            };

            const jsonStr = encodeURIComponent(JSON.stringify(config));
            const encrypted = btoa(jsonStr);
            
            const baseUrl = window.location.origin + window.location.pathname;
            const finalUrl = `${baseUrl}?embed=true#${encrypted}`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(finalUrl).then(() => {
                    showToast('🎉 水晶播放器連結複製成功！快去 Notion 貼上建立嵌入吧！');
                    closeSettings();
                    window.history.replaceState(null, '', finalUrl);
                    loadUrlParams();
                }).catch(() => fallbackCopy(finalUrl));
            } else {
                fallbackCopy(finalUrl);
            }
        });

        // 複製 Fallback
        function fallbackCopy(text) {
            try {
                const tempInput = document.createElement('textarea');
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast('🎉 水晶播放器連結複製成功！快去 Notion 貼上建立嵌入吧！');
                closeSettings();
            } catch (err) {
                showToast('複製失敗，請手動複製網址列。', 'error');
            }
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', loadUrlParams);
    </script>
</body>
