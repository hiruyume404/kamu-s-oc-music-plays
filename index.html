<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber-Cute 迷你水晶音樂播放器</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Google Fonts: Orbitron (科技數字) 與 Quicksand (圓潤可愛體) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Quicksand:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Quicksand', 'Noto Sans TC', 'sans-serif'],
            mono: ['Orbitron', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    /* 虛擬唱片 Holo-Disc 旋轉動畫 */
    @keyframes holo-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .holo-spin-active {
      animation: holo-spin 12s linear infinite;
    }
    .holo-spin-paused {
      animation-play-state: paused;
    }

    /* 呼吸霓虹燈微光 */
    @keyframes neon-pulse {
      0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 4px var(--neon-color)); }
      50% { opacity: 0.7; filter: drop-shadow(0 0 12px var(--neon-color)); }
    }
    .neon-glow {
      animation: neon-pulse 3s ease-in-out infinite;
    }

    /* 自訂拉條樣式 */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--neon-accent, #ff5e97);
      box-shadow: 0 0 8px var(--neon-accent, #ff5e97);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }
    
    /* 玻璃擬態與隱藏捲軸 */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-full w-full bg-transparent m-0 flex flex-col justify-start items-center overflow-x-hidden font-sans select-none" id="body-container">

  <!-- 獨立網頁時的裝飾背景（嵌入 Notion 後不會干擾，會自動完美去背） -->
  <div id="editor-bg" class="fixed inset-0 bg-[#0c0f17] bg-[linear-gradient(to_right,#141923_1px,transparent_1px),linear-gradient(to_bottom,#141923_1px,transparent_1px)] bg-[size:24px_24px] -z-10 transition-colors duration-500"></div>

  <!-- 主容器 (確保完全置中) -->
  <div class="w-full max-w-[420px] px-3 py-6 flex flex-col gap-4 items-center">

    <!-- 🌟 Cyber-Cute 迷你播放器本體 🌟 -->
    <div id="player-card" class="relative w-full h-[90px] rounded-2xl border border-white/10 dark:border-white/5 bg-white/70 dark:bg-[#131722]/50 backdrop-blur-xl shadow-[0_8px_32px_rgba(0,0,0,0.1)] dark:shadow-[0_8px_32px_rgba(0,0,0,0.4)] flex items-center p-3 gap-3 transition-all duration-300" style="--neon-accent: #ff5e97;">
      
      <!-- 卡片內部流線高光 -->
      <div class="absolute inset-x-0 top-0 h-[1px] bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>
      
      <!-- 左：科技感虛擬唱片 (Holo-Disc) -->
      <div class="relative w-[64px] h-[64px] flex-shrink-0 flex items-center justify-center">
        <!-- 唱片主體 (SVG 科技刻度光譜) -->
        <div id="holo-disc" class="absolute inset-0 rounded-full border border-white/10 flex items-center justify-center holo-spin-active holo-spin-paused transition-all duration-300" style="background: radial-gradient(circle, #181d28 40%, var(--vinyl-color, #2d1822) 100%);">
          <!-- 唱片溝槽裝飾線 -->
          <svg class="absolute inset-0 w-full h-full opacity-40 scale-95" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" class="text-white/20" stroke-width="0.5" stroke-dasharray="2 1" />
            <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" class="text-white/30" stroke-width="0.5" />
            <circle cx="50" cy="50" r="25" fill="none" stroke="currentColor" class="text-white/20" stroke-width="0.5" stroke-dasharray="4 2" />
          </svg>
          
          <!-- 中心 OC 圓形頭貼 -->
          <div class="w-[34px] h-[34px] rounded-full overflow-hidden bg-[#242b3d] border border-white/30 z-10 shadow-[0_0_10px_rgba(0,0,0,0.5)]">
            <img id="player-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23ff5e97'><circle cx='50' cy='50' r='35'/><path d='M10 90 Q50 40 90 90' stroke='white' stroke-width='8' fill='none'/></svg>" class="w-full h-full object-cover" alt="Avatar">
          </div>
        </div>
        
        <!-- 科技感雷射讀寫頭小點 (呼吸燈) -->
        <div class="absolute top-1 right-1 w-2.5 h-2.5 rounded-full z-20 neon-glow" style="--neon-color: var(--neon-accent); background-color: var(--neon-accent);"></div>
      </div>

      <!-- 中與右：音訊資訊與控制區 -->
      <div class="flex-grow flex flex-col justify-between h-full py-0.5 min-w-0">
        <!-- 上排：歌曲、歌手與設定鈕 -->
        <div class="flex justify-between items-start gap-1">
          <div class="min-w-0 flex-grow">
            <h3 id="player-title" class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate leading-tight">夢境軌道 (Dream Loop)</h3>
            <p id="player-artist" class="text-[10px] text-slate-500 dark:text-slate-400 truncate leading-tight mt-0.5">Cyber OC Project</p>
          </div>
          <!-- 浮動設定按鈕（在 Notion 嵌入狀態下會完全銷毀） -->
          <button id="btn-config" class="w-6 h-6 rounded-lg bg-slate-200/50 dark:bg-black/20 hover:bg-slate-300/50 dark:hover:bg-black/40 flex items-center justify-center text-slate-600 dark:text-slate-300 transition-all flex-shrink-0" title="自訂設定">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </button>
        </div>

        <!-- 下排：迷你控制面板與進度條 -->
        <div class="flex items-center gap-2">
          <!-- 播放/暫停鍵 (Cyber-Cute 圓形小鈕) -->
          <button id="btn-play" class="w-7 h-7 rounded-full flex items-center justify-center text-white shadow-md shadow-black/10 hover:scale-105 transition-all flex-shrink-0" style="background: linear-gradient(135deg, var(--neon-accent) 0%, #a855f7 100%);">
            <!-- 播放 icon -->
            <svg id="svg-play" class="w-3 h-3 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
            <!-- 暫停 icon (預設隱藏) -->
            <svg id="svg-pause" class="w-3 h-3 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
          </button>

          <!-- 進度條與時間 -->
          <div class="flex-grow flex flex-col justify-end gap-1">
            <div class="flex justify-between items-center text-[8px] font-mono text-slate-400 dark:text-slate-500 tracking-wider">
              <span id="time-current">00:00</span>
              <span id="time-total">00:00</span>
            </div>
            <!-- 音樂軌道 -->
            <input id="progress-bar" type="range" value="0" min="0" max="100" class="w-full h-1 bg-slate-200 dark:bg-white/10 rounded-lg appearance-none cursor-pointer outline-none transition-all">
          </div>
        </div>

      </div>

    </div>

    <!-- ⚙️ 可折疊設定面板 (Notion Embed 狀態下會被完全銷毀，不佔用任何寬度字數) -->
    <div id="edit-panel" class="w-full bg-white dark:bg-[#1a2130] rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-xl flex flex-col gap-3.5 transition-all">
      <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2">
        <span class="font-bold text-xs text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full" style="background-color: var(--neon-accent, #ff5e97);"></span>
          未來感播放器設定
        </span>
        <span class="text-[9px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-1.5 py-0.5 rounded">Configurator</span>
      </div>

      <!-- 1. 歌曲與歌手 -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] text-slate-500 dark:text-slate-400 font-bold mb-1">歌曲名稱</label>
          <input id="input-title" type="text" class="w-full bg-slate-50 dark:bg-[#111622] border border-slate-200 dark:border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 dark:text-slate-200 outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-[10px] text-slate-500 dark:text-slate-400 font-bold mb-1">歌手/OC 名稱</label>
          <input id="input-artist" type="text" class="w-full bg-slate-50 dark:bg-[#111622] border border-slate-200 dark:border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 dark:text-slate-200 outline-none focus:border-purple-500">
        </div>
      </div>

      <!-- 2. 音訊來源設定 -->
      <div>
        <label class="block text-[10px] text-slate-500 dark:text-slate-400 font-bold mb-1">音訊設定模式</label>
        <div class="flex rounded-lg bg-slate-50 dark:bg-[#111622] p-0.5 border border-slate-200 dark:border-slate-800">
          <button id="tab-github" class="flex-1 py-1 text-[10px] font-bold rounded-md bg-white dark:bg-[#1c2436] shadow text-slate-800 dark:text-slate-200 transition-all">GitHub 同目錄</button>
          <button id="tab-direct" class="flex-1 py-1 text-[10px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 transition-all">直鏈網址</button>
          <button id="tab-local" class="flex-1 py-1 text-[10px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 transition-all">本地預覽</button>
        </div>
      </div>

      <!-- 2A. GitHub 同目錄音訊 -->
      <div id="panel-github" class="p-3 bg-slate-50 dark:bg-[#111622] border border-slate-200 dark:border-slate-800 rounded-xl flex flex-col gap-2">
        <p class="text-[9px] text-slate-400 leading-normal">適合與網頁 index.html 一起上傳至 GitHub。請輸入您儲存庫中的音檔名稱即可自動對齊偵測：</p>
        <div class="flex gap-1.5">
          <input id="input-github-name" type="text" placeholder="例如: music.mp3" class="flex-grow bg-white dark:bg-[#1c2436] border border-slate-200 dark:border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-slate-200 outline-none">
          <button id="btn-detect-github" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-[10px] font-bold flex-shrink-0 transition-all">自動偵測</button>
        </div>
      </div>

      <!-- 2B. 網址直鏈音訊 -->
      <div id="panel-direct" class="p-3 bg-slate-50 dark:bg-[#111622] border border-slate-200 dark:border-slate-800 rounded-xl flex flex-col gap-1 hidden">
        <label class="text-[10px] text-slate-400 font-bold mb-1">MP3 音訊直鏈網址</label>
        <input id="input-music-url" type="text" placeholder="https://.../music.mp3" class="w-full bg-white dark:bg-[#1c2436] border border-slate-200 dark:border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 dark:text-slate-200 outline-none">
      </div>

      <!-- 2C. 本地上傳預覽音訊 -->
      <div id="panel-local" class="p-3 bg-slate-50 dark:bg-[#111622] border border-slate-200 dark:border-slate-800 rounded-xl flex flex-col gap-2 hidden">
        <p class="text-[9px] text-red-400 leading-normal">💡 注意：本地檔案僅能於當前瀏覽器播放。若要將播放器嵌入 Notion 使用，請務必改用 GitHub 或網址直鏈模式！</p>
        <label class="w-full h-11 border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-indigo-500 rounded-lg flex items-center justify-center gap-1.5 cursor-pointer bg-white dark:bg-[#1c2436] transition-all">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
          <span id="local-audio-text" class="text-[10px] text-slate-500 dark:text-slate-400 font-bold">選擇本地 MP3 檔案</span>
          <input id="file-audio" type="file" accept="audio/*" class="hidden">
        </label>
      </div>

      <!-- 3. 色系選擇 -->
      <div class="grid grid-cols-2 gap-2">
        <!-- 主題色選擇 -->
        <div>
          <label class="block text-[10px] text-slate-500 dark:text-slate-400 font-bold mb-1">主題氛圍色</label>
          <div class="flex gap-1.5">
            <button class="w-6 h-6 rounded-full border border-white/20 transition-all hover:scale-110 active:scale-95" style="background-color: #ff5e97;" onclick="setThemeColor('#ff5e97', '#2d1822')"></button>
            <button class="w-6 h-6 rounded-full border border-white/20 transition-all hover:scale-110 active:scale-95" style="background-color: #00f0ff;" onclick="setThemeColor('#00f0ff', '#142a3a')"></button>
            <button class="w-6 h-6 rounded-full border border-white/20 transition-all hover:scale-110 active:scale-95" style="background-color: #10b981;" onclick="setThemeColor('#10b981', '#142d20')"></button>
            <button class="w-6 h-6 rounded-full border border-white/20 transition-all hover:scale-110 active:scale-95" style="background-color: #a855f7;" onclick="setThemeColor('#a855f7', '#241434')"></button>
            <input type="color" id="picker-theme" class="w-6 h-6 rounded-full border-none cursor-pointer bg-transparent" title="自訂顏色" oninput="setThemeColor(this.value)">
          </div>
        </div>
        <!-- 唱片封面本地裁切上傳 -->
        <div>
          <label class="block text-[10px] text-slate-500 dark:text-slate-400 font-bold mb-1">上傳專輯封面 (本地壓縮)</label>
          <label class="w-full py-1.5 border border-dashed border-slate-300 dark:border-slate-800 hover:border-indigo-500 rounded-lg flex items-center justify-center gap-1.5 cursor-pointer bg-slate-50 dark:bg-[#111622] transition-all">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold">上傳圖片</span>
            <input id="file-avatar" type="file" accept="image/*" class="hidden">
          </label>
        </div>
      </div>

      <!-- 4. 打包與複製 Notion -->
      <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
        <button id="btn-copy-notion" class="w-full py-2 px-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold text-xs shadow-md transition-all flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          生成並複製 Notion 嵌入連結
        </button>
      </div>
    </div>

  </div>

  <!-- 🎨 微型動態 Toast 提示框 -->
  <div id="toast-box" class="fixed bottom-4 transform translate-y-12 opacity-0 px-4 py-2 rounded-xl border border-white/20 bg-black/80 text-white text-[11px] font-bold tracking-wide shadow-lg flex items-center gap-2 transition-all duration-300 z-50">
    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
    <span id="toast-text">複製成功！</span>
  </div>

  <!-- Audio 核心元件 -->
  <audio id="audio-core" class="hidden" preload="metadata"></audio>

  <!-- ⚙️ JavaScript 邏輯引擎 -->
  <script>
    // 預設與當前設定組態
    const config = {
      title: "夢境軌道 (Dream Loop)",
      artist: "Cyber OC Project",
      accentColor: "#ff5e97",
      vinylColor: "#2d1822",
      musicUrl: "",
      avatar: "", // Base64 或 圖片網址
      mode: "github", // 'github', 'direct'
      githubName: "music.mp3"
    };

    const audio = document.getElementById('audio-core');
    const btnPlay = document.getElementById('btn-play');
    const svgPlay = document.getElementById('svg-play');
    const svgPause = document.getElementById('svg-pause');
    const holoDisc = document.getElementById('holo-disc');
    const progressBar = document.getElementById('progress-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    
    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      loadUrlParams();
      setupPlayer();
      setupConfigurator();
    });

    // 解析 URL 加密字串
    function loadUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const isEmbed = params.get('embed') === 'true';

      // 檢查 Hash 內打包的資料
      const hash = window.location.hash.substring(1);
      if (hash) {
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(hash))));
          Object.assign(config, decoded);
        } catch (e) {
          console.error("無法解碼 Hash 組態:", e);
        }
      }

      // 如果是在 Notion 嵌入模式 (embed=true)
      if (isEmbed) {
        // 100% 徹底清除不必要之設定元件 (物理防漏)
        document.getElementById('edit-panel')?.remove();
        document.getElementById('editor-bg')?.remove();
        document.getElementById('btn-config')?.remove();
        document.getElementById('toast-box')?.remove();
        // 將 body 鎖定為完全透明
        document.getElementById('body-container').className = "h-full w-full bg-transparent m-0 flex justify-center items-start overflow-hidden";
        document.getElementById('player-card').classList.remove('px-3');
        document.getElementById('player-card').classList.add('w-full');
      }
    }

    // 更新播放器 UI 呈現
    function setupPlayer() {
      document.getElementById('player-title').innerText = config.title;
      document.getElementById('player-artist').innerText = config.artist;
      
      const card = document.getElementById('player-card');
      card.style.setProperty('--neon-accent', config.accentColor);
      card.style.setProperty('--vinyl-color', config.vinylColor);

      // 設定大圓角頭像
      const avatarEl = document.getElementById('player-avatar');
      if (config.avatar) {
        avatarEl.src = config.avatar;
      }

      // 對齊與載入音軌
      let targetMusicUrl = config.musicUrl;
      if (config.mode === 'github' && config.githubName) {
        // 從當前部署頁面反推同目錄的 MP3 直鏈網址
        const loc = window.location;
        const basePath = loc.protocol + '//' + loc.host + loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
        targetMusicUrl = basePath + config.githubName;
      }

      if (targetMusicUrl) {
        audio.src = targetMusicUrl;
        audio.load();
      }
    }

    // 播放/暫停事件
    btnPlay.addEventListener('click', () => {
      if (!audio.src) {
        showToast("尚未設定有效的音訊直鏈或檔案！");
        return;
      }
      if (audio.paused) {
        audio.play().then(() => {
          setPlayState(true);
        }).catch(err => {
          console.error("播放失敗:", err);
          showToast("音訊檔案載入出錯，請確認跨域存取(CORS)或網址是否正確。");
        });
      } else {
        audio.pause();
        setPlayState(false);
      }
    });

    function setPlayState(isPlaying) {
      if (isPlaying) {
        svgPlay.classList.add('hidden');
        svgPause.classList.remove('hidden');
        holoDisc.classList.remove('holo-spin-paused');
      } else {
        svgPlay.classList.remove('hidden');
        svgPause.classList.add('hidden');
        holoDisc.classList.add('holo-spin-paused');
      }
    }

    // 音樂時間更新
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.value = percent;
        timeCurrent.innerText = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      timeTotal.innerText = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      setPlayState(false);
      progressBar.value = 0;
      timeCurrent.innerText = "00:00";
    });

    // 跳轉進度條
    progressBar.addEventListener('input', () => {
      if (!isNaN(audio.duration)) {
        const targetTime = (progressBar.value / 100) * audio.duration;
        audio.currentTime = targetTime;
      }
    });

    function formatTime(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // ⚙️ 編輯設定區塊控制
    function setupConfigurator() {
      const panel = document.getElementById('edit-panel');
      const btnConfig = document.getElementById('btn-config');
      
      if (!btnConfig || !panel) return; // Notion 模式下已銷毀

      // 預設展開/折疊
      btnConfig.addEventListener('click', () => {
        panel.classList.toggle('hidden');
      });

      // 初始化輸入框
      document.getElementById('input-title').value = config.title;
      document.getElementById('input-artist').value = config.artist;
      document.getElementById('input-github-name').value = config.githubName;
      document.getElementById('input-music-url').value = config.musicUrl;
      document.getElementById('picker-theme').value = config.accentColor;

      // 即時同步標題與歌手
      document.getElementById('input-title').addEventListener('input', (e) => {
        config.title = e.target.value || "未命名歌曲";
        document.getElementById('player-title').innerText = config.title;
      });
      document.getElementById('input-artist').addEventListener('input', (e) => {
        config.artist = e.target.value || "未知歌手";
        document.getElementById('player-artist').innerText = config.artist;
      });

      // Tab 分頁切換
      const tabGithub = document.getElementById('tab-github');
      const tabDirect = document.getElementById('tab-direct');
      const tabLocal = document.getElementById('tab-local');

      const panelGithub = document.getElementById('panel-github');
      const panelDirect = document.getElementById('panel-direct');
      const panelLocal = document.getElementById('panel-local');

      function switchTab(activeTab, activePanel) {
        [tabGithub, tabDirect, tabLocal].forEach(btn => {
          btn.className = "flex-1 py-1 text-[10px] font-bold rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-700 transition-all";
        });
        activeTab.className = "flex-1 py-1 text-[10px] font-bold rounded-md bg-white dark:bg-[#1c2436] shadow text-slate-800 dark:text-slate-200 transition-all";

        [panelGithub, panelDirect, panelLocal].forEach(p => p.classList.add('hidden'));
        activePanel.classList.remove('hidden');
      }

      tabGithub.addEventListener('click', () => {
        config.mode = "github";
        switchTab(tabGithub, panelGithub);
      });
      tabDirect.addEventListener('click', () => {
        config.mode = "direct";
        switchTab(tabDirect, panelDirect);
      });
      tabLocal.addEventListener('click', () => {
        config.mode = "local";
        switchTab(tabLocal, panelLocal);
      });

      // GitHub 自動對齊偵測
      document.getElementById('btn-detect-github').addEventListener('click', () => {
        const name = document.getElementById('input-github-name').value.trim();
        if (!name) {
          showToast("請輸入音檔檔名！");
          return;
        }
        config.githubName = name;
        setupPlayer();
        showToast("同目錄偵測設定完成！部署後自動對接。");
      });

      // 傳統直鏈變更
      document.getElementById('input-music-url').addEventListener('change', (e) => {
        config.musicUrl = e.target.value.trim();
        setupPlayer();
      });

      // 本地檔案播放上傳 (Object URL)
      document.getElementById('file-audio').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          audio.src = url;
          audio.load();
          document.getElementById('local-audio-text').innerText = file.name;
          showToast(`已成功載入本地檔案，可進行播放測試！`);
        }
      });

      // 專輯封面智慧壓縮 (Canvas Rescale to ~100px WebP)
      document.getElementById('file-avatar').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
              // 建立微型 Canvas
              const canvas = document.createElement('canvas');
              const size = 100; // 精緻迷你尺寸，完美適配 1:1
              canvas.width = size;
              canvas.height = size;
              const ctx = canvas.getContext('2d');

              // 計算等比例中心裁剪
              let sx = 0, sy = 0, sWidth = img.width, sHeight = img.height;
              if (img.width > img.height) {
                sx = (img.width - img.height) / 2;
                sWidth = img.height;
              } else {
                sy = (img.height - img.width) / 2;
                sHeight = img.width;
              }

              ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, size, size);

              // 智慧壓縮
              const base64 = canvas.toDataURL('image/jpeg', 0.65);
              config.avatar = base64;
              document.getElementById('player-avatar').src = base64;
              showToast("頭貼已上傳並完成智慧高畫質壓縮！");
            };
            img.src = evt.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      // 複製 Notion 嵌入連結
      document.getElementById('btn-copy-notion').addEventListener('click', () => {
        // 取消目前在預覽中可能產生的本地 Blob URL，避免打包錯誤
        const copyConfig = { ...config };
        if (copyConfig.mode === 'local') {
          copyConfig.musicUrl = ""; // 本地檔案不打包
        }

        const jsonStr = JSON.stringify(copyConfig);
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        
        // 取得當前網址路徑 (去除原有 hash 與 query)
        const pureUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
        const targetUrl = `${pureUrl}?embed=true#${encoded}`;

        // 複製至剪貼簿
        const tempInput = document.createElement("input");
        document.body.appendChild(tempInput);
        tempInput.value = targetUrl;
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);

        showToast("Notion 嵌入連結已生成並複製成功！🚀");
      });
    }

    // 變更主題色
    function setThemeColor(hexColor, vinylHexColor) {
      config.accentColor = hexColor;
      config.vinylColor = vinylHexColor || hexColor + '22'; // 自動微調唱片盤底色
      
      const card = document.getElementById('player-card');
      card.style.setProperty('--neon-accent', hexColor);
      card.style.setProperty('--vinyl-color', config.vinylColor);
      
      const picker = document.getElementById('picker-theme');
      if (picker) picker.value = hexColor;
    }

    // 美化 Toast 提示框
    function showToast(text) {
      const toast = document.getElementById('toast-box');
      const toastText = document.getElementById('toast-text');
      if (!toast) return;

      toastText.innerText = text;
      toast.classList.remove('translate-y-12', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-12', 'opacity-0');
      }, 3500);
    }
  </script>
</body>
